<script>
	var episodes = [
		"Mr.%20Big", "Diplomat%27s%20Daughter", "School%20Days", "Our%20Man%20in%20Toyland",
		"Now%20You%20See%20Him...%20Now%20You%20Don%27t", "Washington%204%2C%20Indians%203",
		"KAOS%20in%20CONTROL", "The%20Day%20Smart%20Turned%20Chicken", "Satan%20Place",
		"Our%20Man%20in%20Leotards", "Too%20Many%20Chiefs", "My%20Nephew%20the%20Spy",
		"Aboard%20the%20Orient%20Express", "Weekend%20Vampire", "Survival%20of%20the%20Fattest",
		"Double%20Agent", "Kisses%20for%20KAOS", "The%20Dead%20Spy%20Scrawls",
		"Back%20to%20the%20Old%20Drawing%20Board", "All%20in%20the%20Mind", "Dear%20Diary",
		"Smart%2C%20the%20Assassin", "I%27m%20Only%20Human", "Stakeout%20on%20Blue%20Mist%20Mountain",
		"The%20Amazing%20Harry%20Hoo", "Hubert%27s%20Unfinished%20Symphony", "Ship%20of%20Spies%20-%20Pt1",
		"Ship%20of%20Spies%20-%20Pt2", "Shipment%20to%20Beirut", "The%20Last%20One%20in%20is%20a%20Rotten%20Spy"
	];

	var player = null;
	var currentLinkElement = null;
	var statusEl = null;
	var retryCount = 0;
	var retryTimer = null;

	function buildPlaylistTable(tbodyId, isWebOptimised) {
		var tbody = document.getElementById(tbodyId);
		if (!tbody) return;

		tbody.innerHTML = ""; // Clear fallback warning text
		var tr = null;

		for (var i = 0; i < episodes.length; i++) {
			var epName = episodes[i];

			if (i % 5 === 0) {
				tr = document.createElement('tr');
				tbody.appendChild(tr);
			}

			var td = document.createElement('td');
			var trueNum = i + 1;
			var epNum = (trueNum < 10) ? ("0" + trueNum) : String(trueNum);

			var a = document.createElement('a');
			a.href = "#";
			a.className = "video-link";
			a.textContent = "E" + epNum;

			var suffix = isWebOptimised ? ".ia.mp4" : ".mp4";
			var cleanPath = "download/get-smart/Get%20Smart%20S01E" + epNum + "%20%28" + epName + "%29" + suffix;

			a.setAttribute('data-video', cleanPath);
			a.setAttribute('data-index', i);
			a.setAttribute('data-type', isWebOptimised ? 'web' : 'orig');

			a.addEventListener('click', function(event) {
				event.preventDefault();
				playVideo(this, true);
			});

			td.appendChild(a);
			tr.appendChild(td);
		}
	}

	// Shows state on screen, since you can't open a console on the TV
	function setStatus(text) {
		if (statusEl) statusEl.textContent = text;
	}

	function attachHandlers(video) {
		// Errors from <source> children fire on the <source>, not the <video>
		var src = video.getElementsByTagName('source')[0];
		if (src) {
			src.addEventListener('error', function() {
				if (player !== video) return; // stale event from an old element
				if (retryCount < 20) {
					retryCount++;
					setStatus('Source error, retry ' + retryCount + ' of 20...');
					retryTimer = setTimeout(function() {
						retryTimer = null;
						playVideo(currentLinkElement, true, true);
					}, 1500);
				} else {
					setStatus('Source error after 20 tries | ' + src.src);
				}
			});
		}
		video.addEventListener('error', function() {
			setStatus('Error ' + (video.error ? video.error.code : '?'));
		});
		video.addEventListener('loadedmetadata', function() {
			setStatus('Loaded ' + video.videoWidth + 'x' + video.videoHeight);
		});
		video.addEventListener('playing', function() {
			setStatus('Playing');
		});
		video.addEventListener('ended', function() {
			if (!currentLinkElement) return;
			var nextIndex = parseInt(currentLinkElement.getAttribute('data-index'), 10) + 1;
			var currentType = currentLinkElement.getAttribute('data-type');
			var nextLink = document.querySelector('.video-link[data-type="' + currentType + '"][data-index="' + nextIndex + '"]');
			if (nextLink) {
				playVideo(nextLink, true); // true = try autoplay for the next episode
			}
		});
	}

	function playVideo(linkElement, tryAutoplay, isRetry) {
		if (!isRetry) {
			retryCount = 0;
			if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
		}
		if (!linkElement) return;
		if (currentLinkElement) currentLinkElement.classList.remove('active');

		currentLinkElement = linkElement;
		currentLinkElement.classList.add('active');

		var rootDomain = "https://" + "archive.org/";
		var fullTargetUrl = rootDomain + currentLinkElement.getAttribute('data-video');

		var box = document.getElementById('player-box');
		destroyPlayer();
		box.innerHTML = '<video id="tv-player" width="100%" height="auto" controls preload="auto"' +
			(tryAutoplay ? ' autoplay' : '') + '>' +
			'<source src="' + fullTargetUrl + '" type="video/mp4">' +
			'Your browser does not support streaming.</video>';

		player = document.getElementById('tv-player');
		attachHandlers(player);
		setStatus('Loading...');

		window.scrollTo(0, 0);
	}

	function initApp() {
		// Status line under the player
		var box = document.getElementById('player-box');
		statusEl = document.createElement('p');
		statusEl.id = 'status';
		statusEl.style.color = '#e74c3c';
		statusEl.style.margin = '0 0 10px 0';
		box.parentNode.insertBefore(statusEl, box.nextSibling);

		buildPlaylistTable('table-web', true);
		buildPlaylistTable('table-orig', false);
		document.addEventListener('keydown', function(e) {
			var key = e.key || '';
			var code = e.keyCode;
			if (key === ' ' || key === 'Spacebar' || code === 32) {
				togglePlayPause();
				e.preventDefault();
			} else if (key === 'f' || key === 'F' || code === 70) {
				goFullscreen();
				e.preventDefault();
			}
		});
		function centerPlayer() {
			var box = document.getElementById('player-box');
			if (!box) return;
			var rect = box.getBoundingClientRect();
			var viewH = window.innerHeight || document.documentElement.clientHeight;
			var pageY = window.pageYOffset || document.documentElement.scrollTop || 0;
			var target = pageY + rect.top - (viewH - rect.height) / 2;
			window.scrollTo(0, Math.max(0, target)); // instant jump, not smooth
		}
		function goFullscreen() {
			var v = document.getElementById('tv-player');
			if (!v) return;
			centerPlayer();
			if (v.requestFullscreen) v.requestFullscreen();
			else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
			else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
		}
		function togglePlayPause() {
			if (!player) return;
			if (player.paused) {
				var p = player.play();
				if (p && p.catch) p.catch(function () {});
			} else {
				player.pause();
			}
		}
	}

	function destroyPlayer() {
		if (!player) return;
		try {
			player.pause();
			var s = player.getElementsByTagName('source')[0];
			if (s) s.removeAttribute('src');
			player.removeAttribute('src');
			player.load(); // forces the TV to release the old stream
		} catch (e) {}
		player = null;
	}

	if (document.readyState === "complete" || document.readyState === "interactive") {
		initApp();
	} else {
		window.addEventListener('load', initApp);
	}
</script>

<style>
	.player-container { margin: 0 0 10px 0; }
	video { display: block; width: 100%; height: auto; background: #000; }

	table { border-collapse: separate; border-spacing: 5px; margin: 0 0 20px 0; }
	th, td { border: none; }
	td { width: 20%; padding: 0; }

	.video-link { display: block; text-align: center; font-weight: bold; padding: 12px 0; border: 1px solid #666; }
	.video-link:focus, .video-link:hover { outline: 2px solid #fff; }
	.video-link.active { background: #2ecc71; color: #000; }
</style>

<h1>GET SMART</h1>
<p class="subtitle">Season 1 Control Center</p>

<div class="player-container" id="player-box"></div>

<!-- COLUMN A -->
<table>
	<thead><tr><th colspan="5">Web Optimised</th></tr></thead>
	<tbody id="table-web">
		<tr><td colspan="5" style="color: #666; padding: 10px;">Loading grid tracks...</td></tr>
	</tbody>
</table>

<!-- COLUMN B -->
<table>
	<thead><tr><th colspan="5">Original Resolution</th></tr></thead>
	<tbody id="table-orig">
		<tr><td colspan="5" style="color: #666; padding: 10px;">Loading grid tracks...</td></tr>
	</tbody>
</table>
