<style>
	body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
	h1 { text-align: center; color: #e74c3c; margin: 5px 0; }
	.subtitle { text-align: center; color: #888; margin: 0 0 20px 0; }
	.player-container { max-width: 800px; margin: 0 auto 20px auto; background: #000; border: 2px solid #333; border-radius: 6px; overflow: hidden; }
	video { display: block; width: 100%; height: auto; }
	.columns-wrapper { display: flex; max-width: 900px; margin: 0 auto; gap: 20px; }
	.column { flex: 1; background: #1c1c1c; padding: 10px; border-radius: 6px; }
	.column h3 { margin-top: 0; color: #3498db; border-bottom: 1px solid #333; padding-bottom: 5px; }
	.playlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
	.video-link { display: block; color: #fff; text-decoration: none; padding: 10px 2px; background: #2a2a2a; border-radius: 4px; font-weight: bold; text-align: center; font-size: 1rem; }
	.video-link:focus, .video-link:hover { background: #3498db; outline: none; }
	.video-link.active { background: #2ecc71 !important; color: #000 !important; }
</style>

<h1>GET SMART</h1>
<p class="subtitle">Season 1 Control Center</p>

<div class="player-container">
	<video id="tv-player" controls preload="none" src="">
	</video>
</div>

<div class="columns-wrapper">
	<!-- COLUMN A: WEB OPTIMISED -->
	<div class="column">
		<h3>Web Optimised</h3>
		<ul class="playlist" id="list-web"></ul>
	</div>

	<!-- COLUMN B: ORIGINAL -->
	<div class="column">
		<h3>Original</h3>
		<ul class="playlist" id="list-orig"></ul>
	</div>
</div>

<script>
	// Array mapping out the unique episode subtitles/names inside the archive.org paths
	const episodes = [
		"Mr.%20Big", "Diplomat%27s%20Daughter", "School%20Days", "Our%20Man%20in%20Toyland",
		"Now%20You%20See%20Him...%20Now%20You%20Don%27t", "Washington%204%2C%20Indians%203",
		"KAOS%20in%20CONTROL", "The%20Day%20Smart%20Turned%20Chicken", "Satan%20Place",
		"Our%20Man%20in%20Leotards", "Too%20Many%20Chiefs", "My%20Nephew%20the%20Spy",
		"Aboard%20the%20Orient%20Express", "Weekend%20Vampire", "Survival%20of%20the%20Fattest",
		"Double%20Agent", "Kisses%20for%20KAOS", "The%20Dead%20Spy%20Scrawls",
		"Back%20to%20the%20Old%20Drawing%20Board", "All%20in%20the%20Mind", "Dear%20Diary",
		"Smart%2C%20the%20Assassin", "I%27m%20Only%20Human", "Stakeout%20on%20Blue%20Mist%20Mountain",
		"The%20Amazing%20Harry%20Hoo", "Hubert%27s%20Unfinished%20Symphony", "Ship%20of%20Spies%20-%20Pt1",
		"Ship%20of%20Spies%20-%20Pt2", "Shipment%20to%20Beirut", "The%20Last%20One%20in%20is%20a%20Rotten%20Spy"
	];

	const player = document.getElementById('tv-player');
	let currentLinkElement = null;

	// DYNAMIC LINK GENERATOR ENGINE
	function generateGrid(containerId, isWebOptimised) {
		const container = document.getElementById(containerId);
		episodes.forEach((epName, index) => {
			const epNum = String(index + 1).padStart(2, '0');
			const li = document.createElement('li');
			const a = document.createElement('a');
			
			a.href = "#";
			a.className = "video-link";
			a.textContent = `E${epNum}`;
			
			// Formulate the base URL dynamically on click rather than serving hardcoded strings
			const suffix = isWebOptimised ? ".ia.mp4" : ".mp4";
			const fullUrl = `https://archive.org/download/get-smart/Get%20Smart%20S01E${epNum}%20%28${epName}%29${suffix}`;
			a.setAttribute('data-video', fullUrl);

			a.addEventListener('click', function(event) {
				event.preventDefault();
				playVideo(this);
			});

			li.appendChild(a);
			container.appendChild(li);
		});
	}

	function playVideo(linkElement) {
		if (!linkElement) return;
		if (currentLinkElement) currentLinkElement.classList.remove('active');
		
		currentLinkElement = linkElement;
		currentLinkElement.classList.add('active');
		
		player.src = currentLinkElement.getAttribute('data-video');
		player.load();
		player.play();
		window.scrollTo({ top: 0, behavior: 'smooth' });
	}

	// Handle sequential playlist auto-play tracking across dynamically built elements
	player.addEventListener('ended', function() {
		if (!currentLinkElement) return;
		const currentLi = currentLinkElement.closest('li');
		const nextLi = currentLi.nextElementSibling;
		if (nextLi) {
			const nextLink = nextLi.querySelector('.video-link');
			if (nextLink) playVideo(nextLink);
		}
	});

	// Initialize lists immediately upon background engine startup
	generateGrid('list-web', true);
	generateGrid('list-orig', false);
</script>
