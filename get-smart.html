<script>
	var episodes = [
		"Mr.%20Big", "Diplomat%27s%20Daughter", "School%20Days", "Our%20Man%20in%20Toyland",
		"Now%20You%20See%20Him...%20Now%20You%20Don%27t", "Washington%204%2C%20Indians%203",
		"KAOS%20in%20CONTROL", "The%20Day%20Smart%20Turned%20Chicken", "Satan%20Place",
		"Our%20Man%20in%20Leotards", "Too%20Many%20Chiefs", "My%20Nephew%20the%20Spy",
		"Aboard%20the%20Orient%20Express", "Weekend%20Vampire", "Survival%20of%20the%20Fattest",
		"Double%20Agent", "Kisses%20for%20KAOS", "The%20Dead%20Spy%20Scrawls",
		"Back%20to%20the%20Old%20Drawing%20Board", "All%20in%20the%20Mind", "Dear%20Diary",
		"Smart%2C%20the%20Assassin", "I%27m%20Only%20Human", "Stakeout%20on%20Blue%20Mist%20Mountain",
		"The%20Amazing%20Harry%20Hoo", "Hubert%27s%20Unfinished%20Symphony", "Ship%20of%20Spies%20-%20Pt1",
		"Ship%20of%20Spies%20-%20Pt2", "Shipment%20to%20Beirut", "The%20Last%20One%20in%20is%20a%20Rotten%20Spy"
	];

	var player;
	var currentLinkElement = null;

	function buildPlaylistTable(tbodyId, isWebOptimised) {
		var tbody = document.getElementById(tbodyId);
		if (!tbody) return;
		
		tbody.innerHTML = ""; 
		var tr = null;
		
		for (var i = 0; i < episodes.length; i++) {
			if (i % 5 === 0) {
				tr = document.createElement('tr');
				tbody.appendChild(tr);
			}
			
			var td = document.createElement('td');
			var trueNum = i + 1;
			var epNum = (trueNum < 10) ? ("0" + trueNum) : String(trueNum);
			
			var a = document.createElement('a');
			a.href = "#";
			a.className = "video-link";
			a.textContent = "E" + epNum;
			
			var suffix = isWebOptimised ? ".ia.mp4" : ".mp4";
			var fullUrl = "https://archive.org" + epNum + "%20%28" + episodes[i] + "%29" + suffix;
			
			a.setAttribute('data-video', fullUrl);
			a.setAttribute('data-index', i);
			a.setAttribute('data-type', isWebOptimised ? 'web' : 'orig');

			// FIXED: We pass 'a' directly to preserve the exact button instance instead of using 'this'
			a.addEventListener('click', function(event) {
				event.preventDefault();
				var clickedAnchor = event.currentTarget || this;
				playVideo(clickedAnchor);
			});

			td.appendChild(a);
			tr.appendChild(td);
		}
	}

	function playVideo(linkElement) {
		// Error handling check ensures the script stops if a blank context drops in
		if (!linkElement || !linkElement.getAttribute) return;
		
		if (currentLinkElement) currentLinkElement.classList.remove('active');
		
		currentLinkElement = linkElement;
		currentLinkElement.classList.add('active');
		
		var targetVideoUrl = currentLinkElement.getAttribute('data-video');
		
		player.src = targetVideoUrl;
		player.load();
		player.play();
		
		window.scrollTo({ top: 0, behavior: 'smooth' });
	}

	function initApp() {
		player = document.getElementById('tv-player');
		
		buildPlaylistTable('table-web', true);
		buildPlaylistTable('table-orig', false);

		player.addEventListener('ended', function() {
			if (!currentLinkElement) return;
			
			var currentIndex = parseInt(currentLinkElement.getAttribute('data-index'), 10);
			var currentType = currentLinkElement.getAttribute('data-type');
			var nextIndex = currentIndex + 1;
			
			var nextLink = document.querySelector('.video-link[data-type="' + currentType + '"][data-index="' + nextIndex + '"]');
			if (nextLink) {
				playVideo(nextLink);
			}
		});
	}

	if (document.readyState === "complete" || document.readyState === "interactive") {
		initApp();
	} else {
		window.addEventListener('load', initApp);
	}
</script>

<style>
	body { background: #121212; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
	h1 { color: #e74c3c; margin: 5px 0; font-size: 1.8rem; }
	.subtitle { color: #888; margin: 0 0 15px 0; font-size: 1rem; }
	.player-container { max-width: 700px; margin: 0 auto 15px auto; background: #000000; border: 2px solid #333; }
	video { display: block; width: 100%; height: auto; background: #000000; }
	
	table { width: 100%; max-width: 430px; margin: 0 auto 20px auto; border-collapse: separate; border-spacing: 5px; }
	th { color: #3498db; padding-bottom: 5px; font-size: 1.1rem; border-bottom: 1px solid #333; }
	td { width: 20%; padding: 0; }
	
	.video-link { 
		display: block; color: #ffffff; text-decoration: none; background: #2a2a2a; 
		padding: 12px 0; border-radius: 4px; font-weight: bold; font-size: 1.1rem; text-align: center;
	}
	.video-link:focus, .video-link:hover { background: #3498db; outline: none; color: #ffffff; }
	.video-link.active { background: #2ecc71 !important; color: #000000 !important; }
</style>
