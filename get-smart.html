<script>
	var episodes = [
		"Mr. Big", "Diplomat's Daughter", "School Days", "Our Man in Toyland",
		"Now You See Him... Now You Don't", "Washington 4, Indians 3",
		"KAOS in CONTROL", "The Day Smart Turned Chicken", "Satan Place",
		"Our Man in Leotards", "Too Many Chiefs", "My Nephew the Spy",
		"Aboard the Orient Express", "Weekend Vampire", "Survival of the Fattest",
		"Double Agent", "Kisses for KAOS", "The Dead Spy Scrawls",
		"Back to the Old Drawing Board", "All in the Mind", "Dear Diary",
		"Smart, the Assassin", "I'm Only Human", "Stakeout on Blue Myst Mountain",
		"The Amazing Harry Hoo", "Hubert's Unfinished Symphony", "Ship of Spies - Pt1",
		"Ship of Spies - Pt2", "Shipment to Beirut", "The Last One in is a Rotten Spy"
	];

	var currentLinkElement = null;

	function buildPlaylistTable(tbodyId, isWebOptimised) {
		var tbody = document.getElementById(tbodyId);
		if (!tbody) return;
		
		tbody.innerHTML = ""; 
		var tr = null;
		
		for (var i = 0; i < episodes.length; i++) {
			if (i % 5 === 0) {
				tr = document.createElement('tr');
				tbody.appendChild(tr);
			}
			
			var td = document.createElement('td');
			var trueNum = i + 1;
			var epNum = (trueNum < 10) ? ("0" + trueNum) : String(trueNum);
			
			var a = document.createElement('a');
			a.href = "#";
			a.className = "video-link";
			a.textContent = "E" + epNum;
			
			var suffix = isWebOptimised ? ".ia.mp4" : ".mp4";
			var rawFileName = "Get Smart S01E" + epNum + " (" + episodes[i] + ")" + suffix;
			
			var safeEncodedFile = encodeURIComponent(rawFileName)
				.replace(/%20/g, "%20")
				.replace(/\(/g, "%28")
				.replace(/\)/g, "%29")
				.replace(/'/g, "%27");

			a.setAttribute('data-video', safeEncodedFile);
			a.setAttribute('data-index', i);
			a.setAttribute('data-type', isWebOptimised ? 'web' : 'orig');

			a.addEventListener('click', function(event) {
				event.preventDefault();
				playVideo(this);
			});

			td.appendChild(a);
			tr.appendChild(td);
		}
	}

	function playVideo(linkElement) {
		if (!linkElement) return;
		if (currentLinkElement) currentLinkElement.classList.remove('active');
		
		currentLinkElement = linkElement;
		currentLinkElement.classList.add('active');
		
		var fileName = currentLinkElement.getAttribute('data-video');
		var fullTargetUrl = "https://archive.org" + fileName;
		
		// TARGET FIX: Select the outer container wrapper frame out of the DOM layout
		var wrapper = document.getElementById('player-wrapper');
		
		// Purge the old broken video element block entirely to clear the TV hardware decoder cache
		wrapper.innerHTML = "";
		
		// Construct a completely brand new native player object dynamically
		var newPlayer = document.createElement('video');
		newPlayer.id = "tv-player";
		newPlayer.controls = true;
		newPlayer.preload = "auto";
		newPlayer.src = fullTargetUrl;
		
		// Re-bind the continuous autoplay daemon onto the freshly initialized element object
		newPlayer.addEventListener('ended', handleVideoEnded);
		
		// Append the fresh node into the layout tree safely
		wrapper.appendChild(newPlayer);
		
		// Fire execution command strings via delayed hardware buffering protocols
		setTimeout(function() {
			newPlayer.play();
		}, 300);
		
		window.scrollTo({ top: 0, behavior: 'smooth' });
	}

	// Automated continuous autoplay sequence callback handler loops safely
	function handleVideoEnded() {
		if (!currentLinkElement) return;
		
		var currentIndex = parseInt(currentLinkElement.getAttribute('data-index'), 10);
		var currentType = currentLinkElement.getAttribute('data-type');
		var nextIndex = currentIndex + 1;
		
		var nextLink = document.querySelector('.video-link[data-type="' + currentType + '"][data-index="' + nextIndex + '"]');
		if (nextLink) {
			playVideo(nextLink);
		}
	}

	function initApp() {
		buildPlaylistTable('table-web', true);
		buildPlaylistTable('table-orig', false);
	}

	if (document.readyState === "complete" || document.readyState === "interactive") {
		initApp();
	} else {
		window.addEventListener('load', initApp);
	}
</script>

<style>
	body { background: #121212; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
	h1 { color: #e74c3c; margin: 5px 0; font-size: 1.8rem; }
	.subtitle { color: #888; margin: 0 0 15px 0; font-size: 1rem; }
	
	/* Fixed-size wrapper container ensures the box doesn't jump during TV replacement operations */
	.player-container { 
		max-width: 700px; 
		height: 394px; 
		margin: 0 auto 15px auto; 
		background: #000000; 
		border: 2px solid #333; 
		position: relative;
	}
	video { display: block; width: 100%; height: 100%; background: #000000; }
	
	table { width: 100%; max-width: 430px; margin: 0 auto 20px auto; border-collapse: separate; border-spacing: 5px; }
	th { color: #3498db; padding-bottom: 5px; font-size: 1.1rem; border-bottom: 1px solid #333; }
	td { width: 20%; padding: 0; }
	
	.video-link { 
		display: block; color: #ffffff; text-decoration: none; background: #2a2a2a; 
		padding: 12px 0; border-radius: 4px; font-weight: bold; font-size: 1.1rem; text-align: center;
	}
	.video-link:focus, .video-link:hover { background: #3498db; outline: none; color: #ffffff; }
	.video-link.active { background: #2ecc71 !important; color: #000000 !important; }
</style>

	<video id="tv-player" controls preload="none" src=""></video>
</div>

	</tbody>
