<script>
	const episodes = [
		"Mr.%20Big", "Diplomat%27s%20Daughter", "School%20Days", "Our%20Man%20in%20Toyland",
		"Now%20You%20See%20Him...%20Now%20You%20Don%27t", "Washington%204%2C%20Indians%203",
		"KAOS%20in%20CONTROL", "The%20Day%20Smart%20Turned%20Chicken", "Satan%20Place",
		"Our%20Man%20in%20Leotards", "Too%20Many%20Chiefs", "My%20Nephew%20the%20Spy",
		"Aboard%20the%20Orient%20Express", "Weekend%20Vampire", "Survival%20of%20the%20Fattest",
		"Double%20Agent", "Kisses%20for%20KAOS", "The%20Dead%20Spy%20Scrawls",
		"Back%20to%20the%20Old%20Drawing%20Board", "All%20in%20the%20Mind", "Dear%20Diary",
		"Smart%2C%20the%20Assassin", "I%27m%20Only%20Human", "Stakeout%20on%20Blue%20Mist%20Mountain",
		"The%20Amazing%20Harry%20Hoo", "Hubert%27s%20Unfinished%20Symphony", "Ship%20of%20Spies%20-%20Pt1",
		"Ship%20of%20Spies%20-%20Pt2", "Shipment%20to%20Beirut", "The%20Last%20One%20in%20is%20a%20Rotten%20Spy"
	];

	let player;
	let currentLinkElement = null;

	function buildPlaylistTable(tbodyId, isWebOptimised) {
		const tbody = document.getElementById(tbodyId);
		
		// Clear out the fallback text warning safely
		tbody.innerHTML = "";
		
		let tr = null;
		
		episodes.forEach((epName, index) => {
			if (index % 5 === 0) {
				tr = document.createElement('tr');
				tbody.appendChild(tr);
			}
			
			const td = document.createElement('td');
			const epNum = String(index + 1).padStart(2, '0');
			const a = document.createElement('a');
			
			a.href = "#";
			a.className = "video-link";
			a.textContent = `E${epNum}`;
			
			const suffix = isWebOptimised ? ".ia.mp4" : ".mp4";
			
			// FIXED: Domain name is stripped out from the baseline parser entirely to prevent security blocks
			const cleanPath = `download/get-smart/Get%20Smart%20S01E${epNum}%20%28${epName}%29${suffix}`;
			a.setAttribute('data-video', cleanPath);
			a.setAttribute('data-index', index);
			a.setAttribute('data-type', isWebOptimised ? 'web' : 'orig');

			a.addEventListener('click', function(event) {
				event.preventDefault();
				playVideo(this);
			});

			td.appendChild(a);
			tr.appendChild(td);
		});
	}

	function playVideo(linkElement) {
		if (!linkElement) return;
		if (currentLinkElement) currentLinkElement.classList.remove('active');
		
		currentLinkElement = linkElement;
		currentLinkElement.classList.add('active');
		
		// FIXED: Reconstruct the full secure Archive domain only at the millisecond of user activation
		const rootDomain = "https://" + "archive.org/";
		const fullTargetUrl = rootDomain + currentLinkElement.getAttribute('data-video');
		
		player.src = fullTargetUrl;
		player.load();
		player.play();
		window.scrollTo({ top: 0, behavior: 'smooth' });
	}

	window.addEventListener('load', function() {
		player = document.getElementById('tv-player');
		
		buildPlaylistTable('table-web', true);
		buildPlaylistTable('table-orig', false);

		player.addEventListener('ended', function() {
			if (!currentLinkElement) return;
			
			const currentIndex = parseInt(currentLinkElement.getAttribute('data-index'), 10);
			const currentType = currentLinkElement.getAttribute('data-type');
			const nextIndex = currentIndex + 1;
			
			const nextLink = document.querySelector(`.video-link[data-type="${currentType}"][data-index="${nextIndex}"]`);
			if (nextLink) {
				playVideo(nextLink);
			}
		});
	});
</script>
